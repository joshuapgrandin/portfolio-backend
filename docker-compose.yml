services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: